<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boulder review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#221d18;color:#ede5d6;font:14px system-ui}header{padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{font:inherit;background:#42372b;color:inherit;border:1px solid #73604a;padding:6px 8px}main{display:flex;flex-direction:column;gap:10px;padding:10px}article{background:#30291f;padding:8px;border-radius:6px}h2{font-size:13px;margin:0 0 4px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}figure{margin:0;text-align:center}figcaption{font-size:10px;color:#c7b9a2}canvas{display:block;background:#6f8a4e;border-radius:4px}.chip canvas{background:#3a3027;image-rendering:pixelated}#status{padding:0 16px;font-size:12px;color:#d6c094}
</style><body>
<script>
(function(){
  window.__reviewResizeObserver=window.ResizeObserver;
  window.ResizeObserver=class { observe(){} unobserve(){} disconnect(){} };
  function noopCtx(){ return new Proxy({}, { get:function(o,p){
      if(p==='measureText') return function(){return {width:0};};
      if(p==='createLinearGradient'||p==='createRadialGradient'||p==='createPattern')
        return function(){return {addColorStop:function(){}};};
      if(p==='getImageData') return function(){return {data:new Uint8ClampedArray(4)};};
      if(p in o) return o[p]; return function(){};
    }, set:function(o,p,v){o[p]=v;return true;} }); }
  function stub(){
    var el={ tagName:'DIV', nodeType:1,
      classList:{add:function(){},remove:function(){},toggle:function(){return false;},contains:function(){return false;}},
      style:{}, dataset:{}, children:[], width:300, height:150, value:'', textContent:'', innerHTML:'', checked:false,
      appendChild:function(c){return c;}, append:function(){}, prepend:function(){}, remove:function(){},
      removeChild:function(c){return c;}, insertBefore:function(c){return c;},
      setAttribute:function(){}, removeAttribute:function(){}, getAttribute:function(){return null;},
      querySelector:function(){return stub();}, querySelectorAll:function(){return [];},
      getContext:function(){return noopCtx();},
      getBoundingClientRect:function(){return {top:0,left:0,right:0,bottom:0,width:0,height:0};},
      focus:function(){}, click:function(){}, setPointerCapture:function(){}, releasePointerCapture:function(){},
      addEventListener:function(){}, removeEventListener:function(){} };
    return new Proxy(el,{ get:function(o,p){ if(p in o) return o[p];
        if(typeof p==='symbol') return undefined; return function(){}; },
      set:function(o,p,v){o[p]=v;return true;} });
  }
  var realGet=document.getElementById.bind(document);
  document.getElementById=function(id){ return realGet(id) || stub(); };
  window.__realAdd=window.addEventListener; document.__realAdd=document.addEventListener;
  window.addEventListener=function(){}; document.addEventListener=function(){};
  window.__realRAF=window.requestAnimationFrame; window.requestAnimationFrame=function(){return 0;};
})();
</script>
<script src="../js/plants.js"></script>
<script src="../js/core.js"></script>
<script src="../js/draw.js"></script>
<script src="../js/world.js"></script>
<script src="../js/view.js"></script>
<script src="../js/renderer.js"></script>
<script src="../js/commands.js"></script>
<script src="../js/input.js"></script>
<script src="../js/io.js"></script>
<script src="../js/collections.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/tray.js"></script>
<script>
window.addEventListener=window.__realAdd; document.addEventListener=document.__realAdd;
window.requestAnimationFrame=window.__realRAF; window.ResizeObserver=window.__reviewResizeObserver;
</script>
<header><h1>Boulder review</h1>
<label>Stone <select id="stone"><option value="">(type default)</option></select></label>
<label>Season <select id="season"><option>Summer</option><option>Spring</option><option>Fall</option><option>Winter</option></select></label>
<label>Scale <select id="scale"><option value="1">1x</option><option value="1.5" selected>1.5x</option><option value="2">2x</option><option value="3">3x</option></select></label>
<label>Face <select id="face"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
<label>Ground <select id="ground"><option value="#6f8a4e">lawn</option><option value="#a39a86">gravel</option><option value="#5d4a38">mulch</option><option value="#c9c2b2">paving</option></select></label>
<label>View <select id="view"><option value="rots">four rotations</option><option value="sheet">contact sheet</option><option value="stones">every stone</option></select></label>
</header>
<p id="status"></p><main id="out"></main>
<script>
/* Dev-only. Every boulder type, at four rotations beside its tray chip, or as a
   contact sheet (?view=sheet), or one type in every stone it comes in
   (?view=stones&only=<type>). ?stone= ?season= ?scale= ?face= ?ground= ?only=
   ?rots= preset the controls so a headless screenshot can ask for one view
   without clicking, and ?bench=1 times the procedural draw (the cost a sprite
   bake, a garden portrait and a guidebook frame pay). */
const Q=id=>document.getElementById(id), qs=new URLSearchParams(location.search);
const HAS_STONES=typeof BOULDER_STONES!=='undefined';
if (HAS_STONES) BOULDER_STONES.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.label; Q('stone').appendChild(o); });
['stone','season','scale','face','ground','view'].forEach(id=>{ if (qs.has(id)) Q(id).value=qs.get(id); });
function tileDiamonds(c,cx,cy,ax,ay,sz){
  c.strokeStyle='rgba(255,255,255,.22)'; c.lineWidth=1;
  for (let i=0;i<sz.w;i++) for (let j=0;j<sz.h;j++){
    const u=i-(sz.w-1)/2, v=j-(sz.h-1)/2;
    const px=cx+ax[0]*u+ay[0]*v, py=cy+ax[1]*u+ay[1]*v;
    c.beginPath(); c.moveTo(px,py-TILE_H/2); c.lineTo(px+TILE_W/2,py); c.lineTo(px,py+TILE_H/2); c.lineTo(px-TILE_W/2,py); c.closePath(); c.stroke();
  }
}
function recFor(t,stone,face){
  const d={type:t.id}; if (stone) d.stone=stone; if (face) d.face=face;
  return typeof normalizeBoulderDraft==='function' ? normalizeBoulderDraft(d) : d;
}
function panel(rec,rot,k,season,ground,seed){
  const sz=boulderTileSize(rec), span=Math.max(sz.w,sz.h);
  const W=Math.round((90+span*70)*k), H=Math.round((90+span*48)*k);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; cv.style.background=ground;
  const c=cv.getContext('2d');
  c.save(); c.translate(W/2,H*0.66); c.scale(k,k);
  const axes=isoAxes(rot);
  tileDiamonds(c,0,0,axes[0],axes[1],sz);
  drawBoulderArt(c,0,0,rec,season,axes,seed);
  c.restore();
  return cv;
}
function chip(rec){
  const fg=document.createElement('figure'); fg.className='chip';
  const ch=document.createElement('canvas'); ch.width=48; ch.height=44;
  if (typeof drawBoulderChip==='function') drawBoulderChip(ch.getContext('2d'),rec,48,44);
  const big=document.createElement('canvas'); big.width=144; big.height=132;
  const bc=big.getContext('2d'); bc.imageSmoothingEnabled=false; bc.drawImage(ch,0,0,144,132);
  fg.append(ch,big); const cc=document.createElement('figcaption'); cc.textContent='chip'; fg.append(cc);
  return fg;
}
function fig(cv,text){ const fg=document.createElement('figure'); fg.append(cv);
  const cap=document.createElement('figcaption'); cap.textContent=text; fg.append(cap); return fg; }
function render(){
  const out=Q('out'); out.innerHTML='';
  const stone=Q('stone').value, season=Q('season').value, k=+Q('scale').value, face=+Q('face').value;
  const ground=Q('ground').value, view=Q('view').value;
  const only=(qs.get('only')||'').split(',').filter(Boolean);
  const types=BOULDER_TYPES.filter(t=>!only.length||only.includes(t.id));
  const rots=(qs.get('rots')||'0,1,2,3').split(',').map(Number);
  if (view==='sheet'){
    const art=document.createElement('article'), row=document.createElement('div'); row.className='row';
    for (const t of types){ const rec=recFor(t,stone,face);
      row.appendChild(fig(panel(rec,rots[0],k,season,ground,tileSeed(7,9)),t.id+(rec.stone?' / '+rec.stone:''))); }
    art.appendChild(row); out.appendChild(art); return;
  }
  for (const t of types){
    const art=document.createElement('article');
    const h2=document.createElement('h2');
    h2.textContent=(typeof boulderLabel==='function'?boulderLabel(recFor(t,stone,face)):t.label)+'  ['+t.id+']'; art.appendChild(h2);
    const row=document.createElement('div'); row.className='row';
    if (view==='stones' && HAS_STONES){
      for (const s of boulderTypeStones(t.id)) row.appendChild(fig(panel(recFor(t,s.id,face),rots[0],k,season,ground,tileSeed(7,9)),s.label));
    } else {
      for (const r of rots) row.appendChild(fig(panel(recFor(t,stone,face),r,k,season,ground,tileSeed(7,9)),'rot '+r));
      row.appendChild(chip(recFor(t,stone,face)));
    }
    art.appendChild(row); out.appendChild(art);
  }
}
function bench(){
  const cv=document.createElement('canvas'); cv.width=600; cv.height=400;
  const c=cv.getContext('2d'), res=[];
  for (const t of BOULDER_TYPES){
    const rec=recFor(t,Q('stone').value,0), axes=isoAxes(0);
    let best=1e9;
    for (let round=0;round<7;round++){
      const t0=performance.now();
      for (let i=0;i<20;i++) drawBoulderArt(c,300,250,rec,'Summer',axes,tileSeed(i,3));
      c.getImageData(0,0,1,1);
      best=Math.min(best,(performance.now()-t0)/20);
    }
    res.push(t.id+' '+best.toFixed(3)+'ms');
  }
  Q('status').textContent='procedural draw, min of 7 rounds of 20: '+res.join(' | ');
  return res;
}
['stone','season','scale','face','ground','view'].forEach(id=>Q(id).onchange=render);
render();
if (qs.get('bench')) bench();
</script>
</body></html>
