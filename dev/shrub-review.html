<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shrub review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#221d18;color:#ede5d6;font:14px system-ui}
header{padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}
button,select{font:inherit;background:#42372b;color:inherit;border:1px solid #73604a;padding:8px}
#status{padding:0 16px;font-size:12px;color:#d6c094;margin:0}
.sec{font-size:14px;padding:14px 16px 4px;margin:0}
.note{padding:0 16px;margin:0 0 8px;font-size:12px;color:#c7b9a2;max-width:70ch}
#lineup{padding:8px 12px;overflow-x:auto}#lineup canvas{display:block;max-width:none}
#rows{padding:8px 12px;display:flex;flex-direction:column;gap:10px}

#sheet{display:block}
@media (max-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

<script>
// The app's modules expect their DOM; stub what the planner would touch, as
// the other dev review pages do, so only the painters run here.
(function(){
  window.__reviewResizeObserver=window.ResizeObserver;
  window.ResizeObserver=class { observe(){} unobserve(){} disconnect(){} };
  function noopCtx(){ return new Proxy({}, { get:function(o,p){
      if(p==='measureText') return function(){return {width:0};};
      if(p==='createLinearGradient'||p==='createRadialGradient'||p==='createPattern')
        return function(){return {addColorStop:function(){}};};
      if(p==='getImageData') return function(){return {data:new Uint8ClampedArray(4)};};
      if(p in o) return o[p]; return function(){};
    }, set:function(o,p,v){o[p]=v;return true;} }); }
  function stub(){
    var el={ tagName:'DIV', nodeType:1,
      classList:{add:function(){},remove:function(){},toggle:function(){return false;},contains:function(){return false;}},
      style:{}, dataset:{}, children:[], width:300, height:150, value:'', textContent:'', innerHTML:'', checked:false,
      appendChild:function(c){return c;}, append:function(){}, prepend:function(){}, remove:function(){},
      removeChild:function(c){return c;}, insertBefore:function(c){return c;},
      setAttribute:function(){}, removeAttribute:function(){}, getAttribute:function(){return null;},
      querySelector:function(){return stub();}, querySelectorAll:function(){return [];},
      getContext:function(){return noopCtx();},
      getBoundingClientRect:function(){return {top:0,left:0,right:0,bottom:0,width:0,height:0};},
      focus:function(){}, click:function(){}, setPointerCapture:function(){}, releasePointerCapture:function(){},
      addEventListener:function(){}, removeEventListener:function(){} };
    return new Proxy(el,{ get:function(o,p){ if(p in o) return o[p];
        if(typeof p==='symbol') return undefined; return function(){}; },
      set:function(o,p,v){o[p]=v;return true;} });
  }
  var realGet=document.getElementById.bind(document);
  document.getElementById=function(id){ return realGet(id) || stub(); };
  window.__realAdd=window.addEventListener; document.__realAdd=document.addEventListener;
  window.addEventListener=function(){}; document.addEventListener=function(){};
  window.__realRAF=window.requestAnimationFrame; window.requestAnimationFrame=function(){return 0;};
})();
</script>

<header><h1>Shrubs: before and after</h1>
<label>Lineup <select id="group"></select></label>
<label>Season <select id="season"><option>Spring</option><option selected>Summer</option><option>Fall</option><option>Winter</option></select></label>
<label>Rows <select id="habit"><option value="">every shrub</option></select></label>
<button id="reseed">Another seed</button></header>
<p id="status">Loading…</p>
<pre id="bench"></pre>
<canvas id="sheet" hidden></canvas>
<h2 class="sec">At garden scale, before (top) and after (bottom)</h2>
<p class="note">One scale for every shrub in the lineup, the way they meet on a plot. In the app, add <code>?shrub=0</code> to the address to see the old drawing.</p>
<section id="lineup"></section>
<h2 class="sec">Each shrub in four seasons (outlined = after)</h2>
<section id="rows"></section>
<script>
const SR_SEASONS=['Spring','Summer','Fall','Winter'];
const SR_Q=new URLSearchParams(location.search);
/* Try a look change without editing plants.js: ?ov=ninebark:habit=vase,leafN=60|lilac.sensation:twigN=9 */
for (const part of (SR_Q.get('ov')||'').split('|').filter(Boolean)){
  const [key,fields]=part.split(':'), [k,v]=key.split('.');
  const rec=v ? PLANTS[k].cv[v] : PLANTS[k]; if (!rec) continue;
  rec.look=Object.assign({},rec.look||{});
  for (const kv of (fields||'').split(',').filter(Boolean)){
    const [f,val]=kv.split('='); let x=val; try { x=JSON.parse(val); } catch(e){}
    rec.look[f]=x;
  }
}
let SR_SEED=+(SR_Q.get('seed')||4242);
const srHasSwitch=()=>typeof SHRUB_HABIT!=='undefined';
// every informal shrub (the clipped topiary keeps its own drawing) and the
// cultivars that change its look
const SR_REFS=[];
for (const k of PLANT_KEYS){
  const P=PLANTS[k]; if (P.type!=='shrub' || (P.form!=='bush' && P.form!=='hydrangea')) continue;
  if (P.look && P.look.clip) continue;
  SR_REFS.push([k,null]);
  for (const v of Object.keys(P.cv||{})){ const c=P.cv[v]; if (c.look || c.sea) SR_REFS.push([k,v]); }
}
const habitOf=(k,v)=>{ const P=plantDef(k,v), L=P.look||{}; return P.form==='hydrangea' ? 'hydrangea:'+(L.bloomShape||'mop') : (L.habit||'round'); };
const SR_GROUPS={
  'Viburnums and friends':['arrowwood','cranberrybush','koreanspice','doublefile','blackhaw','ninebark','redtwig','winterberry','chokeberry'],
  'Fountains and arches':['forsythia','bridalwreath','weigela','mockorange','bonicarose','virginiasweetspire','beautyberry','cherrylaurel','firebush'],
  'Vases and uprights':['lilac','misskimlilac','summersweet','highbushblueberry','americanelder','commonwitchhazel','redfloweringcurrant','goldencurrant','turkscap'],
  'Broadleaf evergreens':['catawbarhododendron','mountainlaurel','japanesecamellia','pieris','photinia','laurustinus','skimmia','choisya','blueholly','yauponholly'],
  'Low mounds':['lowbushblueberry','fothergilla','cinquefoil','japanesespirea','sweetbox','trailingindigobush','brittlebush','pinkfairyduster','vinehillmanzanita','salal','loworegongrape'],
  'Hydrangeas':['hydrangea','smoothhydrangea','bigleaflace','smoothlace','serratahydrangea','panniclehydrangea','oakleafhydrangea'],
  'Open and twiggy':['staghornsumac','sumac','smokebush','buttonbush','swampazalea','americanhazel','europeanhazel','mountainmahogany','texasmountainlaurel','simpsonsstopper'],
  'Dry and western':['leadplant','newjersey','coralberry','flameacanthus','damianita','apacheplume','californiabuckwheat','clevelandsage','blueblossom','californiacoffeeberry','rubberrabbitbrush','texasrockrose','cenizo','jojoba'],
};
function nameOf(k,v){ return plantDef(k,v).name; }
function shot(k,v,season,on,seed,growth,leafStage,bloom){
  const had=srHasSwitch() ? SHRUB_HABIT.on : null;
  if (srHasSwitch()) SHRUB_HABIT.on=on;
  try {
    const P=plantDef(k,v), g=growth||1, b=plantDrawBox(P,k,g);
    const w=Math.ceil(b.halfW*2), h=Math.ceil(b.top+b.bot);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});
    drawPlant(x,b.halfW,b.top,k,g,season,seed||SR_SEED,0,v,bloom===undefined?1:bloom,undefined,leafStage);
    const d=x.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=0,y1=0;
    for (let y=0;y<h;y+=2) for (let xx=0;xx<w;xx+=2) if (d[(y*w+xx)*4+3]>40){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; }
    return {c, ox:b.halfW, oy:b.top, x0, y0, x1, y1, w, h};
  } finally { if (srHasSwitch()) SHRUB_HABIT.on=had; }
}
function buildRow(host,k,v){
  const P=plantDef(k,v);
  const art=document.createElement('article');
  art.innerHTML='<h2></h2><p class="latin"></p><div class="grid"></div>';
  art.querySelector('h2').textContent=nameOf(k,v)+' — '+habitOf(k,v);
  art.querySelector('.latin').textContent=P.latin||PLANTS[k].latin;
  const cells=[]; let ux0=1e9,uy0=1e9,ux1=-1e9,uy1=-1e9;
  for (const s of SR_SEASONS) for (const on of [false,true]){
    const r=shot(k,v,s,on); cells.push([s,on,r]);
    ux0=Math.min(ux0,r.x0-r.ox); ux1=Math.max(ux1,r.x1-r.ox); uy0=Math.min(uy0,r.y0-r.oy); uy1=Math.max(uy1,r.y1-r.oy);
  }
  const w=ux1-ux0+8, h=uy1-uy0+8, CW=220, CH=220, f=Math.min(CW/w,CH/h);
  const grid=art.querySelector('.grid');
  for (const [s,on,r] of cells){
    const fig=document.createElement('figure'); if (on) fig.className='after';
    const c=document.createElement('canvas'); c.width=CW; c.height=CH;
    c.getContext('2d').drawImage(r.c, r.ox+ux0-4, r.oy+uy0-4, w, h, (CW-w*f)/2, CH-h*f, w*f, h*f);
    const cap=document.createElement('figcaption'); cap.textContent=s+(on?' after':' before');
    fig.append(c,cap); grid.append(fig);
  }
  host.append(art);
}
let rowJob=0;
function buildRows(){
  const host=document.getElementById('rows'); host.innerHTML='';
  const habit=document.getElementById('habit').value;
  const list=SR_REFS.filter(([k,v])=>!habit || habitOf(k,v)===habit);
  const job=++rowJob; let i=0;
  const step=()=>{ if (job!==rowJob) return;
    const t0=performance.now();
    while (i<list.length && performance.now()-t0<40){ const [k,v]=list[i++]; buildRow(host,k,v); }
    document.getElementById('status').textContent=`Seed ${SR_SEED}. ${i} of ${list.length} shrubs drawn.`;
    if (i<list.length) setTimeout(step,0);
  };
  step();
}
function buildLineup(){
  const season=document.getElementById('season').value, host=document.getElementById('lineup'); host.innerHTML='';
  host.append(lineupCanvas(SR_GROUPS[document.getElementById('group').value], season, 1));
}
function lineupCanvas(keys, season, scale, arms){
  arms=arms||[false,true]; const gap=16;
  const shots=[];
  for (const on of arms) for (const ref of keys){ const [k,v]=ref.split('.'); shots.push(shot(k,v||null,season,on)); }
  const n=keys.length;
  const widths=keys.map((_,i)=>Math.max(...arms.map((a,j)=>shots[i+n*j].x1-shots[i+n*j].x0))*scale);
  const tall=Math.max(...shots.map(s=>(s.oy-s.y0)*scale))+22, rowH=tall+30;
  const W=widths.reduce((a,b)=>a+b+gap,gap), H=rowH*arms.length;
  const c=document.createElement('canvas'); c.width=Math.ceil(W); c.height=Math.ceil(H);
  const o=c.getContext('2d'); o.fillStyle='#cdd6be'; o.fillRect(0,0,c.width,c.height);
  for (let row=0; row<arms.length; row++){
    let x=gap; const base=row*rowH+tall;
    o.fillStyle='#b8c4a6'; o.fillRect(0,base-2,c.width,5);
    o.fillStyle='#2a2620'; o.font='bold 12px system-ui'; o.textAlign='left'; o.fillText(arms[row]?'After':'Before',6,row*rowH+14);
    keys.forEach((ref,i)=>{
      const s=shots[row*n+i], cx=x+widths[i]/2;
      const sw=(s.x1-s.x0)*scale, sh=(s.y1-s.y0)*scale, left=cx+(s.x0-s.ox)*scale, top=base+(s.y0-s.oy)*scale;
      o.drawImage(s.c, s.x0, s.y0, s.x1-s.x0, s.y1-s.y0, left, top, sw, sh);
      const [k,v]=ref.split('.'), nm=nameOf(k,v||null), fit=Math.max(6,Math.floor((widths[i]+gap)/6));
      o.fillStyle='#2a2620'; o.font='11px system-ui'; o.textAlign='center'; o.fillText(nm.length>fit?nm.slice(0,fit-1)+'…':nm,cx,base+18);
      x+=widths[i]+gap;
    });
  }
  return c;
}
/* A contact sheet for a headless screenshot: ?sheet=<ref,ref,...|group name|all>
   &seasons=Summer,Winter&cell=180&arm=after|before|both&per=4. */
window.shrubSheet=function(refs,opts){
  opts=opts||{}; const cell=opts.cell||180, seasons=opts.seasons||['Summer','Winter'], per=opts.per||4;
  const arms=opts.arm==='before'?[false]:opts.arm==='both'?[false,true]:[true];
  const lab=14, cols=per*seasons.length*arms.length, rows=Math.ceil(refs.length/per);
  const ov=document.getElementById('sheet'); ov.hidden=false;
  ov.width=cols*cell; ov.height=rows*(cell+lab);
  const o=ov.getContext('2d'); o.fillStyle=opts.bg||'#cdd6be'; o.fillRect(0,0,ov.width,ov.height);
  refs.forEach((ref,i)=>{
    const [k,v]=ref.split('.');
    const rs=[]; for (const on of arms) for (const s of seasons) rs.push(shot(k,v||null,s,on,opts.seed,opts.growth));
    const x0=Math.min(...rs.map(r=>r.x0-r.ox)), x1=Math.max(...rs.map(r=>r.x1-r.ox));
    const y0=Math.min(...rs.map(r=>r.y0-r.oy)), y1=Math.max(...rs.map(r=>r.y1-r.oy));
    const w=x1-x0+4, h=y1-y0+4, f=Math.min((cell-6)/w,(cell-6)/h), row=Math.floor(i/per), col=(i%per)*seasons.length*arms.length;
    rs.forEach((r,j)=>o.drawImage(r.c, r.ox+x0-2, r.oy+y0-2, w, h, (col+j)*cell+(cell-w*f)/2, row*(cell+lab)+cell-h*f, w*f, h*f));
    o.fillStyle='#222'; o.font='10px sans-serif';
    o.fillText(nameOf(k,v||null).slice(0,30)+' · '+habitOf(k,v||null), col*cell+3, row*(cell+lab)+cell+10);
  });
  return ov;
};
/* Leaf-out through spring and leaf drop through late fall, from the console:
   seasonSheet(['forsythia','ninebark']) draws each shrub from March to June and
   from September to December at its leaf stage, the way the garden does. */
window.seasonSheet=function(refs,days,cell){
  days=days||[1,5,7,8.5,10,12,15,  34,40,42,43.5,45,46.5,49];
  cell=cell||97; const lab=16;
  const ov=document.getElementById('sheet'); ov.hidden=false;
  ov.width=days.length*cell; ov.height=refs.length*(cell+lab)+lab;
  const o=ov.getContext('2d'); o.fillStyle='#cdd6be'; o.fillRect(0,0,ov.width,ov.height);
  o.font='10px sans-serif'; o.fillStyle='#222';
  const M=YEAR_DAYS/12, MONS=['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb'];
  const mon=d=>MONS[Math.floor(d/M)%12]+' '+(1+Math.floor((d%M)/M*30));
  days.forEach((d,i)=>o.fillText(mon(d), i*cell+4, 12));
  const stageOf=(P,d,season)=>{
    const lo=typeof woodyLeafOut==='function' ? woodyLeafOut(P) : treeLeafOut(P);
    if (!lo) return undefined;
    if (season==='Spring') return treeLeafStage(lo,d);
    if (season==='Fall' && lo.drop) return treeDropStage(lo.drop,d);
    return undefined;
  };
  refs.forEach((ref,ri)=>{
    const [k,v]=ref.split('.'), P=plantDef(k,v||null);
    const shots=days.map(d=>{
      const season=SEASONS[Math.floor(d/DAYS_PER_SEASON)%4];
      const bl=bloomWindowsFor(P).reduce((l,[a,b])=>Math.max(l,bloomWindowLevel(d,a,b)),0);
      const ls=stageOf(P,d,season);
      const r=shot(k,v||null,season,true,SR_SEED,1,ls,bl);
      return {r,ls,bl};
    });
    const r0=shots[1].r, f=Math.min((cell-8)/(r0.ox*2),(cell-8)/(r0.oy+(r0.h-r0.oy)*0.3));
    shots.forEach((s,i)=>{
      const x0=i*cell, y0=lab+ri*(cell+lab);
      o.save(); o.beginPath(); o.rect(x0,y0,cell,cell); o.clip();
      o.drawImage(s.r.c, x0+cell/2-s.r.ox*f, y0+cell-8-s.r.oy*f, s.r.w*f, s.r.h*f); o.restore();
      o.fillStyle='#222'; o.fillText((i?'':(v||k).slice(0,10)+' ')+'L'+(s.ls===undefined?'-':s.ls)+' b'+s.bl.toFixed(1), x0+3, y0+cell+11);
    });
  });
  return ov;
};
/* Bake cost, the way the sprite cache pays it: each shrub drawn into an
   OffscreenCanvas the size of its sprite box, flushed with a 1px readback, min
   of `rounds`, before and after interleaved. ?bench=all (or a ref list). */
window.shrubBench=function(which,rounds){
  rounds=rounds||+(SR_Q.get('rounds')||7);
  const refs=which==='all'||which==='1' ? SR_REFS.map(([k,v])=>v?k+'.'+v:k) : which.split(',');
  const seasons=(SR_Q.get('seasons')||'Summer,Winter').split(',');
  const rows=[], arm=on=>{ if (srHasSwitch()) SHRUB_HABIT.on=on; };
  for (const ref of refs){
    const [k,v]=ref.split('.'), P=plantDef(k,v||null), b=plantDrawBox(P,k,1);
    const w=Math.ceil(b.halfW*2), h=Math.ceil(b.top+b.bot);
    const oc=new OffscreenCanvas(w,h), x=oc.getContext('2d');
    const row={ref};
    for (const s of seasons){
      const best=[1e9,1e9];
      for (let r=0;r<rounds;r++) for (const on of [false,true]){
        arm(on); x.clearRect(0,0,w,h);
        const t0=performance.now();
        drawPlant(x,b.halfW,b.top,k,1,s,SR_SEED+r,0,v||null,1);
        x.getImageData(0,0,1,1);
        const dt=performance.now()-t0; if (dt<best[on?1:0]) best[on?1:0]=dt;
      }
      row[s]=[+best[0].toFixed(3),+best[1].toFixed(3)];
    }
    arm(true); rows.push(row);
  }
  let pre=document.getElementById('bench');
  pre.textContent='BENCH '+JSON.stringify(rows);
  document.title='bench ready';
  return rows;
};
(function init(){
  const g=document.getElementById('group'); for (const name of Object.keys(SR_GROUPS)){ const o=document.createElement('option'); o.textContent=name; g.append(o); }
  const hs=document.getElementById('habit'); for (const name of [...new Set(SR_REFS.map(([k,v])=>habitOf(k,v)))]){ const o=document.createElement('option'); o.value=o.textContent=name; hs.append(o); }
  g.onchange=document.getElementById('season').onchange=()=>buildLineup();
  hs.onchange=()=>buildRows();
  document.getElementById('reseed').onclick=()=>{ SR_SEED=(SR_SEED*48271+12345)%2147483647; buildLineup(); buildRows(); };
  const sheet=SR_Q.get('sheet');
  setTimeout(()=>{ try {
    if (SR_Q.get('bench')){ shrubBench(SR_Q.get('bench')); return; }
    if (sheet){
      const refs=SR_GROUPS[sheet] || (sheet==='all' ? SR_REFS.map(([k,v])=>v?k+'.'+v:k) : sheet.split(','));
      if (SR_Q.get('year')) seasonSheet(refs);
      else shrubSheet(refs,{seasons:(SR_Q.get('seasons')||'Summer,Winter').split(','), cell:+(SR_Q.get('cell')||180),
        per:+(SR_Q.get('per')||4), arm:SR_Q.get('arm')||'after', growth:+(SR_Q.get('growth')||1), bg:SR_Q.get('bg')||undefined});
      document.getElementById('status').textContent='sheet ready';
      document.title='sheet ready';
      return;
    }
    if (SR_Q.get('rows')!=='0') buildRows();
    buildLineup();
  } catch(e){ document.getElementById('status').textContent='Error: '+e.message; console.error(e); } },20);
})();
</script>
