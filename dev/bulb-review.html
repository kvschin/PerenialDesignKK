<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulb review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#221d18;color:#ede5d6;font:14px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button,select{font:inherit;background:#42372b;color:inherit;border:1px solid #73604a;padding:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:12px;padding:12px}article{background:#30291f;padding:10px;border-radius:6px}h2{font-size:13px;margin:0 0 2px}.latin{font-size:11px;color:#c7b9a2}.seasons{display:flex;justify-content:space-around}figure{margin:0;text-align:center;min-width:0}canvas{width:88px;height:120px;display:block}figcaption{font-size:10px}#status{padding:0 16px;font-size:12px;color:#d6c094}.notes{margin:4px 0;font-size:11px}
#scale{padding:0 12px 12px}#scale canvas{width:100%;height:auto;background:#5f7d58;border-radius:6px}
#zoom{padding:0 12px 12px}#zoom canvas{width:auto;max-width:100%;height:auto;border-radius:6px}#close{padding:0 12px 12px}#close canvas{width:auto;max-width:100%;height:auto;border-radius:6px}#heads{padding:0 12px 12px}#heads canvas{width:100%;height:auto;background:#5f7d58;border-radius:6px}
</style><body>
<script>
(function(){
  window.__reviewResizeObserver=window.ResizeObserver;
  window.ResizeObserver=class { observe(){} unobserve(){} disconnect(){} };
  function noopCtx(){ return new Proxy({}, { get:function(o,p){
      if(p==='measureText') return function(){return {width:0};};
      if(p==='createLinearGradient'||p==='createRadialGradient'||p==='createPattern')
        return function(){return {addColorStop:function(){}};};
      if(p==='getImageData') return function(){return {data:new Uint8ClampedArray(4)};};
      if(p in o) return o[p]; return function(){};
    }, set:function(o,p,v){o[p]=v;return true;} }); }
  function stub(){
    var el={ tagName:'DIV', nodeType:1,
      classList:{add:function(){},remove:function(){},toggle:function(){return false;},contains:function(){return false;}},
      style:{}, dataset:{}, children:[], width:300, height:150, value:'', textContent:'', innerHTML:'', checked:false,
      appendChild:function(c){return c;}, append:function(){}, prepend:function(){}, remove:function(){},
      removeChild:function(c){return c;}, insertBefore:function(c){return c;},
      setAttribute:function(){}, removeAttribute:function(){}, getAttribute:function(){return null;},
      querySelector:function(){return stub();}, querySelectorAll:function(){return [];},
      getContext:function(){return noopCtx();},
      getBoundingClientRect:function(){return {top:0,left:0,right:0,bottom:0,width:0,height:0};},
      focus:function(){}, click:function(){}, setPointerCapture:function(){}, releasePointerCapture:function(){},
      addEventListener:function(){}, removeEventListener:function(){} };
    return new Proxy(el,{ get:function(o,p){ if(p in o) return o[p];
        if(typeof p==='symbol') return undefined; return function(){}; },
      set:function(o,p,v){o[p]=v;return true;} });
  }
  var realGet=document.getElementById.bind(document);
  document.getElementById=function(id){ return realGet(id) || stub(); };
  window.__realAdd=window.addEventListener; document.__realAdd=document.addEventListener;
  window.addEventListener=function(){}; document.addEventListener=function(){};
  window.__realRAF=window.requestAnimationFrame; window.requestAnimationFrame=function(){return 0;};
})();
</script>

<header><h1>Bulbs</h1><label>Group <select id="batch"></select></label><label>Renderer <select id="art"><option value="1">ART2</option><option value="0">Classic</option></select></label><button id="check">Check sprite edges</button></header>
<p id="status">Loading…</p><main id="plants"></main>
<div id="zoom"></div>
<div id="close"></div>
<div id="heads"></div>
<div id="scale"></div>
<script>
/* Every bulb in the catalog, by group, for the bulb audit (0.9.124, and the
   additions of 0.9.136). Cultivars
   are listed by the catalog. ?only=key,key:cv narrows it. */
const FAMILIES={
  winter:['snowdrop','winteraconite','crocuschrysanthus','crocus','crocusvernus','irisreticulata','scillasiberica','glorysnow','puschkinia','anemoneblanda','woodanemone','springbeauty','yellowtroutlily','cyclamencoum'],
  spring:['daffodil','muscari','muscarilatifolium','hyacinth','ipheion','fritillaria','crownimperial','persianlily','leucojum','englishbluebell','poppyanemone'],
  tulips:['tulip','tulipatarda','tuliplinifolia','tulipsylvestris','gardentulip'],
  tall:['camassia','camassiaquamash','camassialeichtlinii','scillaperuviana'],
  alliums:['alliumPurpleSensation','alliumGlobemaster','alliumGladiator','alliumMountEverest','alliumPinkJewel','alliumAtropurpureum','alliumChristophii','alliumRedMohican','alliumcarinatum','alliumcaeruleum','alliumsphaerocephalon','alliummoly','alliumschubertii'],
  lilies:['claudeshride','michiganlily','liliummartagon','liliumsuperbum','liliumregale','orientallily','asiaticlily','canadalily','woodlily'],
  summer:['lycoris','dahlia','crocosmia','foxtaillily','byzantineglad'],
  fall:['colchicum','crocusspeciosus','lycorisradiata','cyclamenhederifolium'],
};
const expand=keys=>keys.filter(k=>PLANTS[k]).flatMap(k=>[[k,null],...Object.keys(PLANTS[k].cv||{}).map(v=>[k,v])]);
const batchSel=document.getElementById('batch');
for(const name of ['all',...Object.keys(FAMILIES)]){const o=document.createElement('option');o.value=o.textContent=name;batchSel.append(o);}
const params=new URLSearchParams(location.search);
if(params.has('batch'))batchSel.value=params.get('batch');
/* Try a change without editing plants.js, patched before anything is drawn so
   plantDef's cache never sees the old record:
   ?ov=rudbeckia:discW=2.8,sea.Summer.eye=%23c9a62e|helenium.moerheim:stems=9 */
for (const part of (params.get('ov')||'').split('|').filter(Boolean)){
  const [key,fields]=part.split(':'), [k,v]=key.split('.');
  const rec=v ? PLANTS[k].cv[v] : PLANTS[k]; if (!rec) continue;
  rec.look=Object.assign({},rec.look||{});
  for (const kv of (fields||'').split(',').filter(Boolean)){
    const [f,val]=kv.split('='); let x=val; try { x=JSON.parse(val); } catch(e){}
    if (f.startsWith('sea.')){ const [,s,g]=f.split('.'); rec.sea=rec.sea||{}; rec.sea[s]=Object.assign({},rec.sea[s]||{},{[g]:x}); }
    else if (f.startsWith('rec.')) rec[f.slice(4)]=x;
    else rec.look[f]=x;
  }
}
function currentRefs(){
  // ?only=key,key:cv narrows the sheet for a headless screenshot
  const only=params.get('only');
  if(only)return only.split(',').map(s=>{const [k,v]=s.split(':');return [k,v||null];});
  const b=batchSel.value;
  return expand(b==='all'?Object.values(FAMILIES).flat():FAMILIES[b]);
}
const bloomSeason=(k,v)=>{const D=plantDef(k,v);return SEASONS.find(x=>D.sea[x]&&D.sea[x].bloom)||'Spring';};
const seasons=params.get('seasons')?params.get('seasons').split(','):SEASONS;
function renderReview(){
  ART2.on=document.getElementById('art').value==='1';
  const refs=currentRefs();
  const host=document.getElementById('plants');host.replaceChildren();
  if(!params.has('nocards'))for(const [k,v] of refs){
    const P=plantDef(k,v),card=document.createElement('article');
    card.innerHTML='<h2>'+P.name+'</h2><div class="latin">'+P.latin+' · '+k+(v?':'+v:'')+'</div><div class="seasons"></div>';
    for(const season of seasons){
      const fig=document.createElement('figure'),c=libCanvas(k,v,season,88,120);
      fig.append(c);const label=document.createElement('figcaption');label.textContent=season;fig.append(label);card.querySelector('.seasons').append(fig);
    }
    const note=document.createElement('p');note.className='notes';
    note.textContent=(P.heightIn?P.heightIn+' in tall':'h '+P.h+' px')+' · '+P.spread+' in wide · zones '+P.zones.join('-')+' · bloom '+(P.bloomMonths||[]).join(',');card.append(note);host.append(card);
  }
  document.getElementById('status').textContent=refs.length+' exact plant choices · actual library previews';
  renderZoom(refs);renderClose(refs);renderHeads(refs);renderScale(refs);
}
/* One flower head per choice, drawn large, so ray shape, count, droop and the
   cone can be compared without the plant around them. Drawn by asking the
   plant for its own head: a single stem, full bloom, zoomed. */
function renderHeads(refs){
  const box=document.getElementById('heads');box.replaceChildren();
  if(params.has('noheads'))return;
  const fixedSeason=params.get('headSeason');
  const perRow=+params.get('headsPerRow')||10,cellW=+params.get('headCellW')||120,rowH=+params.get('headRowH')||150,rows=Math.ceil(refs.length/perRow);
  const c=document.createElement('canvas');c.width=perRow*cellW*2;c.height=rows*rowH*2;box.append(c);
  const ctx=c.getContext('2d');ctx.scale(2,2);
  refs.forEach(([k,v],i)=>{
    const x=(i%perRow)*cellW+cellW/2,y=Math.floor(i/perRow)*rowH;
    ctx.save();ctx.beginPath();ctx.rect(x-cellW/2+2,y+2,cellW-4,rowH-20);ctx.clip();
    const P=plantDef(k,v), H=plantVisualH(P);
    // scale so the top headFrac of the plant (and the heads over it) fills the cell
    const frac=+params.get('headFrac')||0.5, z=Math.min(+params.get('headZmax')||4,(rowH-30)/(H*frac*1.14));
    ctx.translate(x,y+8+H*z*1.14);ctx.scale(z,z);
    drawPlant(ctx,0,0,k,1,fixedSeason||bloomSeason(k,v),tileSeed(i+11,5),0,v||null,1);
    ctx.restore();
    ctx.fillStyle='#f4eee2';ctx.font='10px system-ui';ctx.textAlign='center';
    const name=v?PLANTS[k].cv[v].name:P.name;
    ctx.fillText(name.length>22?name.slice(0,21)+'…':name,x,y+rowH-6);
  });
}
/* ?zoom: the top ?zf (default 0.3) of each choice's drawing, measured, filling a
   ?zoomW x ?zoomH cell, in its bloom season (or ?zoomSeason): close enough to
   judge a flower's shape on a plant of any height. ?zoom=0 hides it. */
function renderZoom(refs){
  const box=document.getElementById('zoom');box.replaceChildren();
  if(!params.has('zoom')||params.get('zoom')==='0')return;
  const cellW=+params.get('zoomW')||360,cellH=+params.get('zoomH')||300,frac=+params.get('zf')||0.3,perRow=Math.max(1,Math.floor(1240/cellW));
  const c=document.createElement('canvas');c.width=perRow*cellW;c.height=Math.ceil(refs.length/perRow)*cellH;box.append(c);
  const ctx=c.getContext('2d');
  refs.forEach(([k,v],i)=>{
    const season=params.get('zoomSeason')||bloomSeason(k,v), seed=tileSeed(i+11,5);
    let top=0;const probe=new Proxy({},{get:(o,p)=>p in o?o[p]:p==='measureText'?()=>({width:0}):/^create/.test(p)?()=>({addColorStop(){}}):(...a)=>{
      if(p==='moveTo'||p==='lineTo')top=Math.min(top,a[1]);else if(p==='ellipse')top=Math.min(top,a[1]-a[3]);else if(p==='quadraticCurveTo')top=Math.min(top,a[3]);},set:(o,p,x)=>{o[p]=x;return true;}});
    drawPlant(probe,0,0,k,1,season,seed,0,v||null,1);
    const span=Math.max(4,-top*frac), z=Math.min(40,(cellH-30)/span), x=(i%perRow)*cellW, y=Math.floor(i/perRow)*cellH;
    ctx.fillStyle=(i%2)?'#5f7d58':'#5a7853';ctx.fillRect(x,y,cellW,cellH);
    ctx.save();ctx.beginPath();ctx.rect(x,y,cellW,cellH-18);ctx.clip();
    ctx.translate(x+cellW/2,y+10-top*z);ctx.scale(z,z);
    drawPlant(ctx,0,0,k,1,season,seed,0,v||null,1);ctx.restore();
    ctx.fillStyle='#f4eee2';ctx.font='11px system-ui';ctx.textAlign='left';
    const P=plantDef(k,v);ctx.fillText((v?PLANTS[k].cv[v].name:P.name)+' · '+season+' · x'+z.toFixed(1),x+6,y+cellH-5);
  });
}
/* Close up: each choice in its four seasons, drawn ?cz times life size (default
   5) on a lawn-green ground, three seeds side by side in a little drift, since
   a mat is too small to judge in a library card. ?close=0 hides it. */
function renderClose(refs){
  const box=document.getElementById('close');box.replaceChildren();
  if(params.get('close')==='0')return;
  const z=+params.get('cz')||5, cellW=+params.get('closeW')||300, rowH=+params.get('closeH')||170;
  const c=document.createElement('canvas');c.width=seasons.length*cellW;c.height=refs.length*rowH;box.append(c);
  const ctx=c.getContext('2d');
  refs.forEach(([k,v],r)=>{
    seasons.forEach((season,s)=>{
      const x=s*cellW, y=r*rowH;
      ctx.fillStyle=(r+s)%2?'#5f7d58':'#5a7853';ctx.fillRect(x,y,cellW,rowH);
      ctx.save();ctx.beginPath();ctx.rect(x,y,cellW,rowH);ctx.clip();
      ctx.translate(x+cellW/2,y+rowH-26);ctx.scale(z,z);
      const spots=[[-13,-3],[12,-4],[0,3]];
      spots.forEach(([dx,dy],i)=>drawPlant(ctx,dx,dy,k,1,season,tileSeed(i+5,r+9),0,v||null,1));
      ctx.restore();
      ctx.fillStyle='#f4eee2';ctx.font='11px system-ui';ctx.textAlign='left';
      const P=plantDef(k,v),name=v?PLANTS[k].cv[v].name:P.name;
      ctx.fillText(name+' · '+season,x+6,y+rowH-8);
    });
  });
}
/* The same plants at their true drawn scale, side by side, with a 6 ft post. */
function renderScale(refs){
  const box=document.getElementById('scale');box.replaceChildren();
  if(params.has('noscale'))return;
  const fixedSeason=params.get('scaleSeason');
  const list=refs.filter(([k])=>PLANTS[k]);
  // ?z=2 draws the lineup larger, still at one scale for every plant
  const z=+params.get('z')||1;
  const perRow=+params.get('perRow')||10,cellW=+params.get('cellW')||150,rowH=+params.get('rowH')||250,rows=Math.ceil(list.length/perRow);
  const c=document.createElement('canvas');c.width=perRow*cellW*2*z;c.height=rows*rowH*2*z;box.append(c);
  const ctx=c.getContext('2d');ctx.scale(2*z,2*z);
  list.forEach(([k,v],i)=>{
    const x=(i%perRow)*cellW+cellW/2,y=(Math.floor(i/perRow)+1)*rowH-22;
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x-cellW/2+6,y,cellW-12,1);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-cellW/2+4,y-feetToPx(6),2,feetToPx(6));
    drawPlant(ctx,x,y,k,1,fixedSeason||bloomSeason(k,v),tileSeed(i+3,7),0,v||null,1);
    const P0=plantDef(k,v);if(P0.heightIn){ctx.fillStyle='rgba(255,220,120,.8)';ctx.fillRect(x-14,y-P0.heightIn*PX_PER_FT/12,28,1);}
    ctx.fillStyle='#f4eee2';ctx.font='10px system-ui';ctx.textAlign='center';
    const P=plantDef(k,v),name=v?PLANTS[k].cv[v].name:P.name;ctx.fillText(name.length>24?name.slice(0,23)+'…':name,x,y+13);
  });
}
/* Sprites are ImageBitmaps since 0.9.38, so copy each onto a canvas to read it. */
function checkEdges(){
  const bad=[];let count=0,previews=0;const original=ART2.on;
  const refs=expand(Object.values(FAMILIES).flat());
  const scratch=document.createElement('canvas'),sctx=scratch.getContext('2d',{willReadFrequently:true});
  try{for(const mode of [false,true]){ART2.on=mode;
    for(const [k,v] of refs)for(const season of SEASONS)for(const seed of [7,101,4410])for(const growth of [3,8]){
      const s=makePlantSprite(k,growth,3,season,seed,v),img=s&&s.cv;if(!img)continue;
      const w=img.width,h=img.height;
      scratch.width=w;scratch.height=h;sctx.clearRect(0,0,w,h);sctx.drawImage(img,0,0);
      const d=sctx.getImageData(0,0,w,h).data;
      let edge=false;for(let x=0;x<w;x++)if(d[x*4+3]>8||d[((h-1)*w+x)*4+3]>8)edge=true;
      for(let y=0;y<h;y++)if(d[y*w*4+3]>8||d[(y*w+w-1)*4+3]>8)edge=true;
      if(edge)bad.push(k+(v?':'+v:'')+' '+season+' seed '+seed+' g'+growth+(mode?' art2':' classic'));count++;
    }
    TRAY_ART.clear();
    for(const [k,v] of refs)for(const season of SEASONS){
      for(const [surface,c] of [['library',libCanvas(k,v,season,70,105)],['tray',trayPlantArt(k,v,season,plantDef(k,v))]]){
        const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let edge=false;
        for(let x=0;x<w;x++)if(d[x*4+3]>8)edge=true;
        for(let y=0;y<h-18;y++)if(d[y*w*4+3]>8||d[(y*w+w-1)*4+3]>8)edge=true;
        if(edge)bad.push(k+(v?':'+v:'')+' '+season+' '+surface+(mode?' art2':' classic'));previews++;
      }
    }
  }}finally{ART2.on=original;TRAY_ART.clear();}
  window.reviewResult={count,previews,bad};
  document.getElementById('status').textContent=count+' sprite and '+previews+' preview checks: '+(bad.length?bad.length+' touching edges — '+bad.join('; '):'no painted edges');
  return window.reviewResult;
}
/* What one bake costs, procedural, in this browser. ?bench=1 */
function bench(){
  const c=new OffscreenCanvas(420,520),ctx=c.getContext('2d'),rows=[];
  // ?bench=bloom times each choice in its own bloom season only
  for(const [k,v] of currentRefs())for(const season of (params.get('bench')==='bloom'?[bloomSeason(k,v)]:['Summer','Fall','Winter'])){
    let best=Infinity;
    for(let r=0;r<3;r++){
      const t0=performance.now();
      for(let i=0;i<8;i++)drawPlant(ctx,210,480,k,1,season,tileSeed(i,3),0,v||null,1);
      best=Math.min(best,(performance.now()-t0)/8);
    }
    rows.push([k+(v?':'+v:''),season,+best.toFixed(3)]);
  }
  window.__bench=rows;
  document.getElementById('status').textContent='bench done: '+rows.length+' rows, see window.__bench';
  return rows;
}
batchSel.onchange=renderReview;document.getElementById('art').onchange=renderReview;document.getElementById('check').onclick=checkEdges;
if(params.has('art'))document.getElementById('art').value=params.get('art');
try{renderReview();if(params.has('check'))setTimeout(checkEdges,0);if(params.has('bench'))setTimeout(bench,0);}catch(error){document.getElementById('status').textContent='Review failed: '+(error.stack||error);}
</script></html>
