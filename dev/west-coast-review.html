<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>West Coast plant review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#221d18;color:#ede5d6;font:14px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button,select{font:inherit;background:#42372b;color:inherit;border:1px solid #73604a;padding:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:12px}article{background:#30291f;padding:10px;border-radius:6px}h2{font-size:13px;margin:0 0 2px}.latin{font-size:11px;color:#c7b9a2}.seasons{display:flex;justify-content:space-around}figure{margin:0;text-align:center;min-width:0}canvas{width:70px;height:105px;display:block}figcaption{font-size:10px}#status{padding:0 16px;font-size:12px;color:#d6c094}.notes{margin:4px 0;font-size:11px}
</style><body>
<script>
(function(){
  window.__reviewResizeObserver=window.ResizeObserver;
  window.ResizeObserver=class { observe(){} unobserve(){} disconnect(){} };
  function noopCtx(){ return new Proxy({}, { get:function(o,p){
      if(p==='measureText') return function(){return {width:0};};
      if(p==='createLinearGradient'||p==='createRadialGradient'||p==='createPattern')
        return function(){return {addColorStop:function(){}};};
      if(p==='getImageData') return function(){return {data:new Uint8ClampedArray(4)};};
      if(p in o) return o[p]; return function(){};
    }, set:function(o,p,v){o[p]=v;return true;} }); }
  function stub(){
    var el={ tagName:'DIV', nodeType:1,
      classList:{add:function(){},remove:function(){},toggle:function(){return false;},contains:function(){return false;}},
      style:{}, dataset:{}, children:[], width:300, height:150, value:'', textContent:'', innerHTML:'', checked:false,
      appendChild:function(c){return c;}, append:function(){}, prepend:function(){}, remove:function(){},
      removeChild:function(c){return c;}, insertBefore:function(c){return c;},
      setAttribute:function(){}, removeAttribute:function(){}, getAttribute:function(){return null;},
      querySelector:function(){return stub();}, querySelectorAll:function(){return [];},
      getContext:function(){return noopCtx();},
      getBoundingClientRect:function(){return {top:0,left:0,right:0,bottom:0,width:0,height:0};},
      focus:function(){}, click:function(){}, setPointerCapture:function(){}, releasePointerCapture:function(){},
      addEventListener:function(){}, removeEventListener:function(){} };
    return new Proxy(el,{ get:function(o,p){ if(p in o) return o[p];
        if(typeof p==='symbol') return undefined; return function(){}; },
      set:function(o,p,v){o[p]=v;return true;} });
  }
  var realGet=document.getElementById.bind(document);
  document.getElementById=function(id){ return realGet(id) || stub(); };
  window.__realAdd=window.addEventListener; document.__realAdd=document.addEventListener;
  window.addEventListener=function(){}; document.addEventListener=function(){};
  window.__realRAF=window.requestAnimationFrame; window.requestAnimationFrame=function(){return 0;};
})();
</script>
<script src="../js/plants.js"></script>
<script src="../js/core.js"></script>
<script src="../js/draw.js"></script>

<script>
window.addEventListener=window.__realAdd; document.addEventListener=document.__realAdd;
window.requestAnimationFrame=window.__realRAF; window.ResizeObserver=window.__reviewResizeObserver;
</script>
<header><h1>West Coast — phases 1a / 1b</h1><label>Batch <select id="batch"><option value="ca">California</option><option value="pnw">Pacific Northwest</option></select></label><label>Renderer <select id="art"><option value="1">ART2</option><option value="0">Classic</option></select></label><button id="check">Check sprite edges</button></header>
<p id="status">Loading…</p><main id="plants"></main>
<script>
const batches={ca:['deergrass','purpleneedlegrass','californiafuchsia','californiabuckwheat','clevelandsage','foothillpenstemon','narrowleafmilkweed','hummingbirdsage','seasidedaisy','blueblossom','vinehillmanzanita','californiacoffeeberry'],pnw:['westernswordfern','roemersfescue','redfloweringcurrant','salal','oregoniris','oregonsunshine','loworegongrape','sloughsedge','insideoutflower','vinemaple']};
function renderReview(){
  ART2.on=document.getElementById('art').value==='1';
  const host=document.getElementById('plants');host.replaceChildren();
  const keys=batches[document.getElementById('batch').value];
  for(const k of keys){
    const P=PLANTS[k],card=document.createElement('article');
    card.innerHTML='<h2>'+P.name+'</h2><div class="latin">'+P.latin+'</div><div class="seasons"></div>';
    for(const season of ['Spring','Summer','Fall','Winter']){
      const fig=document.createElement('figure'),c=libCanvas(k,null,season,70,105);
      fig.append(c);const label=document.createElement('figcaption');label.textContent=season;fig.append(label);card.querySelector('.seasons').append(fig);
    }
    const note=document.createElement('p');note.className='notes';note.textContent=P.heightIn+' in tall · '+P.spread+' in wide · '+P.type;card.append(note);host.append(card);
  }
  document.getElementById('status').textContent=keys.length+' species · all four seasonal previews · actual library canvas sizing';
}
function checkEdges(){
  const bad=[];let count=0;
  for(const k of [...batches.ca,...batches.pnw])for(const v of [null,...Object.keys(PLANTS[k].cv||{})])for(const season of ['Spring','Summer','Fall','Winter'])for(const seed of [7,101,4410]){
    const s=makePlantSprite(k,8,3,season,seed,v),c=s.cv,w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;
    let edge=false;for(let x=0;x<w;x++)if(d[x*4+3]>8||d[((h-1)*w+x)*4+3]>8)edge=true;
    for(let y=0;y<h;y++)if(d[y*w*4+3]>8||d[(y*w+w-1)*4+3]>8)edge=true;
    if(edge)bad.push(k+(v?':'+v:'')+' '+season+' seed '+seed);count++;
  }
  document.getElementById('status').textContent=count+' sprite checks: '+(bad.length?bad.length+' touching edges — '+bad.join('; '):'no painted edges');
}
document.getElementById('batch').onchange=renderReview;document.getElementById('art').onchange=renderReview;document.getElementById('check').onclick=checkEdges;renderReview();
</script></html>
